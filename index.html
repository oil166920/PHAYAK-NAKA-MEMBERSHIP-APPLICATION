<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>พยัคฆ์นาคา</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      font-family: Arial, sans-serif;
    }

    .logo-wrapper {
      text-align: center;
    }

    .logo {
      width: 220px;
      height: 220px;
      margin: auto;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      border: 4px solid #d4af37;
      box-shadow:
        0 0 15px rgba(212, 175, 55, 0.7),
        0 0 45px rgba(212, 175, 55, 0.25);
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .title {
      margin-top: 18px;
      color: #d4af37;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 8px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="logo-wrapper">

    <div class="logo">
      <img
        src="https://cdn.imagetourls.com/uploads/tyImg/l6FD0lgD.png"
        alt="พยัคฆ์นาคา"
      >
    </div>

    <div class="title">
      พยัคฆ์นาคา
    </div>

    <div class="subtitle">
      เสือที่มีนาคาคอยปกปัก
    </div>

  </div>

</body>
</html>
